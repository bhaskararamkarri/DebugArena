default_provider: "nebius"
hackathon_track: "Coding and Agentic Engineering"

providers:
  nebius:
    base_url: "https://api.tokenfactory.nebius.com/v1"
    api_key_env: "NEBIUS_API_KEY"
  nvidia:
    base_url: "https://integrate.api.nvidia.com/v1"
    api_key_env: "NVIDIA_API_KEY"
  openrouter:
    base_url: "https://openrouter.ai/api/v1"
    api_key_env: "OPENROUTER_API_KEY"
  mock:
    base_url: "mock"
    api_key_env: "MOCK_KEY"

models:
  nemotron_nano:
    name: "nvidia/NVIDIA-Nemotron-3-Nano-30B-A3B"
    provider: "nebius"
    temperature: 0.2
    max_tokens: 4096
  nemotron_super:
    name: "nvidia/nemotron-3-super-120b-a12b"
    provider: "nebius"
    temperature: 0.2
    max_tokens: 4096
  nemotron_judge:
    name: "nvidia/Nemotron-3-Ultra-550b-a55b"
    provider: "nebius"
    temperature: 0.0
    max_tokens: 500

environment:
  max_steps: 10
  timeout_seconds: 10
  mem_limit: "256m"
  cpu_limit: 0.5
  pids_limit: 128
  sandbox_mode: "auto" # "docker", "local", or "auto"
  output_max_chars: 4000

reward:
  step_cost: 0.01
  regression_penalty: 0.20

dataset:
  min_pass_rate: 1.0
  export_dir: "dataset"

observability:
  langsmith_enabled: false
  project: "agentgym"
