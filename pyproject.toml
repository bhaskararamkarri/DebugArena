[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[project]
name = "debugarena"
version = "0.1.0"
description = "DebugArena — an arena where coding agents compete on real bugs, scored by hidden tests in a Docker sandbox, and every attempt becomes training data"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pytest>=8.0.0",
    "streamlit>=1.35.0",
    "docker>=7.0.0",
    "openai>=1.30.0",
    "pydantic>=2.7.0",
    "pyyaml>=6.0.1",
    "python-dotenv>=1.0.1",
    "pandas>=2.2.0",
    "altair>=5.3.0",
    "rich>=13.7.0",
    "langsmith>=0.1.0",
]
